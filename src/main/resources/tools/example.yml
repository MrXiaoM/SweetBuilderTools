# 是否启用该配置
enable: false
# 需要什么权限才能使用这个工具？设为 none 无需权限
permission: none

# 放置方块配置
place-blocks:
  # 默认方块
  default: STONE
  # 是否禁止挖掘方块后掉落物品
  # 该功能仅限 1.16.4+ 版本使用
  disable-drops: true
  # 可以选择的方块列表
  list:
  - STONE
  - DEEPSLATE
  - GRANITE
  - DIORITE
  - ANDESITE
  - CALCITE
  - TUFF
  # 物品材质是否随着选择的方块变化而变化
  use-material-by-block: true

# 方块数量，infinite 代表无限制
amount: 512

# 将相应物品拖入这个工具，用于补充数量
recover-by-swap:
  # 是否启用这个功能
  enable: false
  # 拖入什么物品可以补充数量
  # 特殊值 '*' 代表上述配置的方块列表
  list:
    - '*'

# 物品配置
item:
  material: PAPER
  display: '&e废石包 - %material%'
  # 数量更新时，是否更新物品的耐久度，以便展示当前大致用量
  durability: true
  lore:
    - '&7剩余数量: &f%current_amount% / %max_amount%'
    - ''
    - '&b物品栏右键 &7| &f选择方块类型'

# 事件执行操作
events:
  placed:
    - '[actionbar]&e废石包 - %material%&r&7 | &f%current_amount% &7/ &f%max_amount%'
  no-amounts:
    - '[message]&e你的废石包已经用完了'
  no-selected:
    - '[message]&e尚未选择任何方块，请先到物品栏选择方块类型'
